[package]
name = "horn-nvidia-task"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[[bin]]
name = "nvidia_probe"
path = "src/main.rs"

[dependencies]
horn-nvidia = {path = ".."}
horn-nvidia-gsp = {path = "../gsp"}
horn-driver = {path = "../../horn-driver"}
horn-devmgr = {path = "../../../core/devmgr"}
horn-runtime = {path = "../../../runtime/rust/horn-runtime"}
horn-ipc = {path = "../../../runtime/rust/horn-ipc", features = ["sel4"]}
horn-supervisor = {path = "../../../core/supervisor", features = ["client"]}
sel4 = {path = "../../../../vendor/rust-sel4/src/crates/sel4"}

[build-dependencies]
horn-idl-build.workspace = true
