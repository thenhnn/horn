[package]
name = "horn-driver"
version = "0.1.0"
edition = "2024"

[features]
virtio = ["dep:horn-virtio"]

[dependencies]
horn-virtio = {path = "../virtio", optional = true}
horn-devmgr = { path = "../../core/devmgr" }
horn-ipc = { path = "../../runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../vendor/rust-sel4/src/crates/sel4" }
