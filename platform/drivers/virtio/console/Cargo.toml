[package]
name = "horn-virtio-console"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "virtio_console"
path = "src/main.rs"

[features]
# Deliberate invalid device addresses, only for isolated QEMU negative tests.
dma-probe = []

[dependencies]
horn-virtio = { path = ".." }
horn-runtime = { path = "../../../runtime/rust/horn-runtime" }
horn-devmgr = { path = "../../../core/devmgr" }
horn-ipc = { path = "../../../runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../../vendor/rust-sel4/src/crates/sel4" }
