[package]
name = "horn-virtio-console"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "virtio_console"
path = "src/main.rs"

[features]
# Deliberate invalid device addresses, only for isolated QEMU negative tests.
dma-probe = []

[dependencies]
horn-virtio = { path = ".." }
horn-mimalloc = { path = "../../../runtime/rust/horn-mimalloc" }
horn-devmgr = { path = "../../../core/devmgr" }
horn-ipc = { path = "../../../runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../../vendor/rust-sel4/src/crates/sel4" }
sel4-dlmalloc = { path = "../../../../vendor/rust-sel4/src/crates/sel4-dlmalloc" }
sel4-panicking = { path = "../../../../vendor/rust-sel4/src/crates/sel4-panicking", features = ["personality", "panic-handler", "alloc"] }
sel4-panicking-env = { path = "../../../../vendor/rust-sel4/src/crates/sel4-panicking/env" }
sel4-runtime-common = { path = "../../../../vendor/rust-sel4/src/crates/sel4-runtime-common", features = ["sel4"] }
