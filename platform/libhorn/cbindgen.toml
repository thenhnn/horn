language = "C"
include_guard = "HORN_STARTUP_H"
autogen_warning = "/* Generated by cbindgen from libhorn. Do not edit. */"
documentation = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]

[parse]
parse_deps = false

[export]
include = ["HornStartup", "HornContextEntry"]
exclude = ["Context", "RuntimeConfig", "Entry", "Error"]
