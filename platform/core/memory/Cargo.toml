[package]
name = "horn-memory"
version = "0.1.0"
edition = "2024"

[features]
sel4 = ["dep:sel4", "dep:sel4-abstract-allocator"]
rpc = ["sel4", "dep:horn-ipc"]

[dependencies]
horn-ipc = { path = "../../../runtime/rust/horn-ipc", features = ["sel4"], optional = true }
sel4-abstract-allocator = { path = "../../../vendor/rust-sel4/src/crates/experimental/sel4-abstract-allocator", optional = true }
sel4 = { path = "../../../vendor/rust-sel4/src/crates/sel4", optional = true }
