[package]
name = "horn-vm"
version = "0.1.0"
edition = "2024"

[features]
sel4 = ["dep:sel4", "dep:sel4-abstract-allocator"]
protocol = ["dep:horn-ipc"]
rpc = ["sel4", "protocol", "horn-ipc/sel4"]

[dependencies]
horn-ipc = { path = "../../../platform/runtime/rust/horn-ipc", optional = true }
sel4-abstract-allocator = { path = "../../../vendor/rust-sel4/src/crates/experimental/sel4-abstract-allocator", optional = true }
sel4 = { path = "../../../vendor/rust-sel4/src/crates/sel4", optional = true }

[build-dependencies]
horn-idl-build.workspace = true

