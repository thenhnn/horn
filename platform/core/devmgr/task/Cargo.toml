[package]
name = "horn-devmgr-task"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "devmgr"
path = "src/main.rs"

[features]
boot-tests = []

[dependencies]
horn-console = { path = "../../console" }
acpi = { version = "=5.2.0", default-features = false }
horn-devmgr = { path = ".." }
horn-supervisor = { path = "../../supervisor", features = ["client"] }
horn-runtime = { path = "../../../runtime/rust/horn-runtime" }
horn-ipc = { path = "../../../../platform/runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../../vendor/rust-sel4/src/crates/sel4" }
