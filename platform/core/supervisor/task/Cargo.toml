[package]
name = "horn-supervisor-task"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "supervisor"
path = "src/main.rs"

[features]
boot-tests = []

[dependencies]
owo-colors = { version = "=4.4.0", default-features = false }
horn-log = { path = "../../log" }
libhorn = { path = "../../../libhorn" }
horn-registry = {path = "../../registry"}
horn-supervisor = { path = "..", features = ["client"] }
horn-runtime = { path = "../../../runtime/rust/horn-runtime" }
horn-vm = { path = "../../vm" }
horn-ipc = { path = "../../../runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../../vendor/rust-sel4/src/crates/sel4" }
