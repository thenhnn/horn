[package]
name = "horn-timerd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "timerd"
path = "src/main.rs"

[dependencies]
horn-clock = {path = ".."}
horn-supervisor = {path = "../../supervisor", features = ["client"]}
horn-runtime = {path = "../../../runtime/rust/horn-runtime"}
horn-ipc = {path = "../../../runtime/rust/horn-ipc", features = ["sel4"]}
sel4 = {path = "../../../../vendor/rust-sel4/src/crates/sel4"}
