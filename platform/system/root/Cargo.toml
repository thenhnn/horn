[package]
name = "horn-system-root"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "task"
path = "src/main.rs"

[features]
boot-tests = []

[dependencies]
libhorn = { path = "../../libhorn" }
horn-supervisor = { path = "../../core/supervisor" }
horn-devmgr = { path = "../../core/devmgr" }
horn-procd = { path = "../../core/procd" }
horn-vm = { path = "../../core/vm", features = ["rpc"] }
horn-ipc = { path = "../../runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../vendor/rust-sel4/src/crates/sel4" }
sel4-root-task = { path = "../../../vendor/rust-sel4/src/crates/sel4-root-task" }
