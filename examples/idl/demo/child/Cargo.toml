[package]
name = "idl-demo-child"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "task"
path = "src/main.rs"

[[bin]]
name = "launched"
path = "src/launched.rs"

[dependencies]
horn-procd = { path = "../../../../platform/core/procd" }
horn-mimalloc = { path = "../../../../platform/runtime/rust/horn-mimalloc" }
horn-runtime = { path = "../../../../platform/runtime/rust/horn-runtime" }
horn-vm = { path = "../../../../platform/core/vm", features = ["protocol"] }
cfg-if = "1.0.4"
horn-ipc = { path = "../../../../platform/runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../../vendor/rust-sel4/src/crates/sel4" }
