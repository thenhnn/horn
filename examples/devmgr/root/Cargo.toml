[package]
name = "devmgr-demo-root"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "task"
path = "src/main.rs"

[features]
boot-tests = []

[dependencies]
horn-supervisor = { path = "../../../platform/core/supervisor" }
horn-devmgr = { path = "../../../platform/core/devmgr" }
horn-procd = { path = "../../../platform/core/procd" }
horn-vm = { path = "../../../platform/core/vm", features = ["rpc"] }
horn-ipc = { path = "../../../platform/runtime/rust/horn-ipc", features = ["sel4"] }
sel4 = { path = "../../../vendor/rust-sel4/src/crates/sel4" }
sel4-root-task = { path = "../../../vendor/rust-sel4/src/crates/sel4-root-task" }
